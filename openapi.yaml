openapi: 3.0.1
info:
  title: SIPp Call Emulator Service API
  version: v0.2.0-alpha
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: READY
        '503':
          description: Not ready
  /calls/outgoing:
    post:
      summary: Create outgoing call (launch SIPp UAC)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutgoingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOutgoingResponse'
        '409':
          description: Max calls / no ports
        '500':
          description: Start failed
  /calls/{callId}/dtmf:
    post:
      summary: Send DTMF digits
      parameters:
        - $ref: '#/components/parameters/CallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DTMFRequest'
      responses:
        '501':
          description: Not Implemented - DTMF only works via scenario files
  /calls/{callId}/hangup:
    post:
      summary: Hangup call (graceful)
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallContext'
        '404':
          description: Not found
  /calls/{callId}/disconnect:
    post:
      summary: Disconnect call (force)
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallContext'
        '404':
          description: Not found
  /calls/{callId}/status:
    get:
      summary: Get call status
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallContext'
        '404':
          description: Not found

components:
  parameters:
    CallId:
      name: callId
      in: path
      required: true
      schema:
        type: string

  schemas:
    CreateOutgoingRequest:
      type: object
      required: [remoteHost, remotePort, service, scenario]
      properties:
        remoteHost:
          type: string
          example: 10.0.0.100
        remotePort:
          type: integer
          example: 5060
        destination:
          type: string
          example: "1010050"
          description: Optional label for your own tracking
        service:
          type: string
          example: "1234567890"
          description: Required - the phone number or service ID you want to call
        scenario:
          type: string
          example: outgoing.xml
    CreateOutgoingResponse:
      type: object
      required: [callId, state]
      properties:
        callId:
          type: string
        state:
          $ref: '#/components/schemas/CallState'
    DTMFRequest:
      type: object
      required: [digits]
      properties:
        digits:
          type: string
          example: "123"
        interDigitDelayMs:
          type: integer
          example: 100
    CallState:
      type: string
      enum: [CREATED, CALLING, RINGING, ESTABLISHED, HANGUP, DISCONNECTED, FAILED]
    CallContext:
      type: object
      properties:
        callId:
          type: string
        state:
          $ref: '#/components/schemas/CallState'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        remoteHost:
          type: string
        remotePort:
          type: integer
        destination:
          type: string
        service:
          type: string
          description: The phone number or service ID being called
        scenario:
          type: string
        sipPort:
          type: integer
        mediaPort:
          type: integer
          description: Port for audio/RTP traffic
        controlPort:
          type: integer
        processPid:
          type: integer
        lastError:
          type: string
