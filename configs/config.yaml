### Example configuration for SIPp Call Emulator Service
# This file can be loaded via Viper or environment variables.
# Environment variables override file values.

SIPP_BINARY: "/usr/local/bin/sipp"
SCENARIOS_DIR: "/opt/sipp/scenarios"
LOCAL_IP: "" # optional; if empty the service will try to auto-detect the outgoing IP of the container/host

# Where to store SIPp logs (required for Docker if SCENARIOS_DIR is mounted read-only).
# For each call, a subfolder <LOGS_DIR>/<callId>/ is created with scenarios and SIPp trace logs.
LOGS_DIR: "/app/logs"

# Port allocation for the new three-port allocator:
# Each call requires 3 ports: SIP signaling, RTP media, and SIPp remote control
# SIP and Media ports are allocated from the same range (but guaranteed to be different)
# Control ports are allocated from a separate range to avoid conflicts
SIP_PORT_RANGE_START: "6000"
SIP_PORT_RANGE_END: "6499"    # Used for both SIP signaling and RTP media ports

CONTROL_PORT_RANGE_START: "6500"
CONTROL_PORT_RANGE_END: "6999"  # Used for SIPp remote control ports

# Important: remote-control SIPp (-cp) uses UDP, not TCP.
# With current ranges: max ~250 concurrent calls (500 SIP ports / 2 ports per call)

MAX_ACTIVE_CALLS: 20

CONTROL_CONNECT_TIMEOUT_MS: 500
CONTROL_READ_TIMEOUT_MS: 500

API_BIND: "0.0.0.0:8080"
